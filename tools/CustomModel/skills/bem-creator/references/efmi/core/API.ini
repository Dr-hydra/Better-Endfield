; ------------------------------------------------------------------------------
; - COMPONENT API - DRAW CALL
; ------------------------------------------------------------------------------

[Constants]
global $merged_skeleton_connected = 0

[CommandListComponent_Instance_DrawOriginal]
if $PoolSpatialIdentity_IdentifiedInstances[$draw_call_instance_id] == $enum_override_type_original
    drawindexedinstanced = INDEX_COUNT, 1, 0, 0, $draw_call_instance_id
endif


[CommandListCallback_Component_DrawCustom]

[CommandList_Component_Instance_DrawCustom]
if $PoolSpatialIdentity_IdentifiedInstances[$draw_call_instance_id] == $enum_override_type_custom
    if $merged_skeleton_connected
        run = CommandListMergedSkeleton_Apply
    else
        run = CommandListComponent_SetInstanceConfig_VS
        run = CommandListComponent_SetInstanceConfig_PS
    endif
    run = CommandListCallback_Component_DrawCustom
endif


[CommandListCallback_MergedSkeleton_ConnectComponent]


[CommandListComponent_DrawInstances]

if $draw_call_has_unknown_instance
    CommandListCallback_OnInstance = ref CommandListComponent_Instance_DrawOriginal
    run = CommandListIterateInstances
endif

if $draw_call_has_modded_instance
    if $gpu_posed
        run = CommandListCallback_MergedSkeleton_ConnectComponent
        if @ResourceOutput_MergedSkeleton != 0
            run = CommandListMergedSkeleton_DetectBoneDataSource
            if $bones_data_source != 0
                $merged_skeleton_connected = 1
            else
                ResourceOutput_MergedSkeleton = null
                CommandListCallback_MergedSkeleton_ConnectComponent = null
            endif
        endif
    endif
    CommandListCallback_OnInstance = ref CommandList_Component_Instance_DrawCustom
    run = CommandListIterateInstances
endif

if $merged_skeleton_connected
    ResourceOutput_MergedSkeleton = null
    CommandListCallback_MergedSkeleton_ConnectComponent = null
    $merged_skeleton_connected = 0
    $skip_skeleton_override = 0
elif !$gpu_posed
    CommandListCallback_MergedSkeleton_ConnectComponent = null
endif


[CommandListComponent_DrawInstances_NoDecomposition]
run = CommandListCallback_Component_DrawCustom


; ------------------------------------------------------------------------------
; - TEXT PRINTER API
; ------------------------------------------------------------------------------

; Prints text on screen using provided params
[CommandListPrintText]
; Input:
; Resource\EFMIv1\Text
; Resource\EFMIv1\TextParams
;
; Usage example (resource formats are listed below):
; Resource\EFMIv1\Text = ref ResourceMyText
; Resource\EFMIv1\TextParams = ref ResourceMyTextParams
; run = CommandList\EFMIv1\PrintText
run = CommandListRenderText


; Text string example resource printable by CommandListPrintText
[ResourceTextExample]
type = Buffer
data = "Hello World!"


; Text file example resource printable by CommandListPrintText
[ResourceTextFileExample]
type = buffer
format = R8_UINT
filename = MyText.txt


; Text params example resource for CommandListPrintText
; Using these parameter buffers as a way to pass in constant parameters without
; taking up any of the IniParams slots while still allowing the parameters to
; be customised on a per-message basis.
[ResourceTextParamsExample]
type = StructuredBuffer
array = 1
data = R32_FLOAT  -0.25 +0.15 +0.25 -0.05   1.00 1.00 1.00 1.00   0.00 0.00 0.00 0.95   0.02  0.05   2 1   1   1.0
;                x1-^  y1-^  x2-^  y2-^   | R-^  G-^  B-^  A-^  | R-^  G-^  B-^  A-^  | ^-H    V-^ | ^ ^ | ^- text alignment: 0=left 1=center 2=right | ^- font scale
;                Rectangle (range -1:+1)  | Text Color          | Background Color    | Border     |  ^- h/v-anchor: 0=none 1=left/top 2=center 3=right/bottom 
