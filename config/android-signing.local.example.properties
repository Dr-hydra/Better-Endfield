# Copy to android-next-signing.local.properties on each build machine.
# Next uses its own release key. Transfer the SAME Next key securely between
# build machines; do not reuse the old 3.x key or generate a key per build.
# Relative storeFile paths resolve from the repository root. Use / in Windows paths.
storeFile=config/secrets/next/android-next.p12
keyAlias=next-release
# Set passwords locally or supply BE_ANDROID_STORE_PASSWORD and
# BE_ANDROID_KEY_PASSWORD. Do not commit local credentials.
storePassword=REPLACE_LOCALLY
keyPassword=REPLACE_LOCALLY
