namespace = EFMIv1


; ------------------------------------------------------------------------------
; - GLOBAL CONFIG CONSTANTS
; ------------------------------------------------------------------------------

[Constants]
global locked $cfg_instance_config_byte_size = 16 * 4 * 4


; ------------------------------------------------------------------------------
; - SHAPE KEYS API
; ------------------------------------------------------------------------------

; EFMI Tools exports `mod.ini` with dedicated `CommandListSetShapeKey`.
;
; Usage example (set `Component 0` `Shape Key 0` value to `0.5`):
;
; $component_id = 0
; $shapekey_id = 0
; $shapekey_value = 0.5
; run = CommandListSetShapeKey


; ------------------------------------------------------------------------------
; - OBJECT API - READ CONFIG
; ------------------------------------------------------------------------------

[CommandListObject_ReadConfig]
; Just a dummy for now, but mods should call it after setting object-wide data.

; CommandListObject_ReadConfig INPUT

[Constants]
global $bones_count = 0
global $component_count = 0
global $instance_count = 8
global $custom_mesh_scale = 1.0


; ------------------------------------------------------------------------------
; - COMPONENT API - READ CONFIG
; ------------------------------------------------------------------------------

[ResourceOriginal_VS_CB_Temp]

[CommandListComponent_ReadConfig]
if vs-cb2->Size / 16 == 4096
    $instance_config_vs_cb_slot = 2
    $instance_config_vs_cb_byte_offset = vs-cb2->Offset
    ResourceOriginal_VS_CB = ref vs-cb2
elif vs-cb1->Size / 16 == 4096
    $instance_config_vs_cb_slot = 1
    $instance_config_vs_cb_byte_offset = vs-cb1->Offset
    ResourceOriginal_VS_CB = ref vs-cb1
elif vs-cb3->Size / 16 == 4096
    $instance_config_vs_cb_slot = 3
    $instance_config_vs_cb_byte_offset = vs-cb3->Offset
    ResourceOriginal_VS_CB = ref vs-cb3
else
    $instance_config_vs_cb_slot = -1
endif

if ps-cb2->Size / 16 == 4096
    $instance_config_ps_cb_slot = 2
    $instance_config_ps_cb_byte_offset = ps-cb2->Offset
    ResourceOriginal_PS_CB = ref ps-cb2
elif ps-cb1->Size / 16 == 4096
    $instance_config_ps_cb_slot = 1
    $instance_config_ps_cb_byte_offset = ps-cb1->Offset
    ResourceOriginal_PS_CB = ref ps-cb1
else
    $instance_config_ps_cb_slot = -1
endif

; CommandListComponent_ReadConfig INPUT

[Constants]
global $component_id = 0
global $gpu_posed = 0
global $lod_level = 0

; CommandListComponent_ReadConfig OUTPUT

[ResourceOriginal_VS_CB]

[ResourceOriginal_PS_CB]

[Constants]
global $instance_config_vs_cb_slot = 0
global $instance_config_vs_cb_byte_offset = 0

global $instance_config_ps_cb_slot = 0
global $instance_config_ps_cb_byte_offset = 0


; ------------------------------------------------------------------------------
; - COMPONENT API - SET INSTANCE CONFIG
; ------------------------------------------------------------------------------

[CommandListComponent_SetInstanceConfig_VS]
if $draw_call_instance_id > 0
    if $instance_config_vs_cb_slot == 2
        vs-cb2 = ref ResourceOriginal_VS_CB->Region($instance_config_vs_cb_byte_offset + $draw_call_instance_id * $cfg_instance_config_byte_size, $cfg_instance_config_byte_size)
    else if $instance_config_vs_cb_slot == 1
        vs-cb1 = ref ResourceOriginal_VS_CB->Region($instance_config_vs_cb_byte_offset + $draw_call_instance_id * $cfg_instance_config_byte_size, $cfg_instance_config_byte_size)
    else if $instance_config_vs_cb_slot == 3
        vs-cb3 = ref ResourceOriginal_VS_CB->Region($instance_config_vs_cb_byte_offset + $draw_call_instance_id * $cfg_instance_config_byte_size, $cfg_instance_config_byte_size)
    endif
endif


[CommandListComponent_SetInstanceConfig_PS]
if $draw_call_instance_id > 0
    if $instance_config_ps_cb_slot == 2
        ps-cb2 = ref ResourceOriginal_PS_CB->Region($instance_config_ps_cb_byte_offset + $draw_call_instance_id * $cfg_instance_config_byte_size, $cfg_instance_config_byte_size)
    else if $instance_config_ps_cb_slot == 1
        ps-cb1 = ref ResourceOriginal_PS_CB->Region($instance_config_ps_cb_byte_offset + $draw_call_instance_id * $cfg_instance_config_byte_size, $cfg_instance_config_byte_size)
    endif
endif


