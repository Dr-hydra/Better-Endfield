# Copy to android-signing.local.properties on each build machine.
# Keep the SAME original 3.5.0 private key on both machines; never generate a replacement.
# Relative storeFile paths resolve from the repository root. Use / in Windows paths.
storeFile=config/secrets/android/release.keystore
keyAlias=androiddebugkey
# These are the standard passwords of the EXISTING Android debug key.
# If the original key used different passwords, change them locally or supply
# BE_ANDROID_STORE_PASSWORD and BE_ANDROID_KEY_PASSWORD. Do not commit local credentials.
storePassword=android
keyPassword=android
