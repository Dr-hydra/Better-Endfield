[Module]
id=betterendfield.buff-probe
library=BetterEndfield.BuffProbe.dll
enabled=true
api=BetterEndfield_GetModuleApiV1
contract=il2cpp-metadata
contract_version=1
hook_group=buff-research
requires=Gameplay.Beyond.dll

; Local development tool. Dumps every BuffData the client can load to
; %LOCALAPPDATA%\BetterEndfield\combat-buffs.json.
;
; Needs combat-buff-ids.txt next to the DLL:
;     python tools/CombatDataExporter/build_buff_table.py --emit-id-list <dir>
;
; Enter any battle first (that is what hands the probe a BattleDataLoader
; instance), then press the hotkey. The dump loads ~2.5 MB of resources in one
; go and freezes the frame for a second or two; it runs once per session.
hotkey=Ctrl+F9
